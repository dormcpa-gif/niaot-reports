[project]
name = "niaot-reports-backend"
version = "0.1.0"
description = "IBKR statement -> Israeli Form 1301 Nispach C/D helper appendix generator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pdfplumber>=0.11",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "openpyxl>=3.1",
    "python-multipart>=0.0.12",
    "anthropic>=0.40",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
